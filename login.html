<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rider Login | VeloMoto Bike Taxi</title>
  <meta name="description" content="Sign in to your VeloMoto rider account to manage rides, track active bookings, and view ride history.">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5.3 CSS -->
  <link id="bootstrapCSS" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script>
    (function() {
      const theme = localStorage.getItem('velomoto_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.setAttribute('data-bs-theme', theme);
      const dir = localStorage.getItem('velomoto_direction');
      if (dir === 'rtl') {
        document.documentElement.setAttribute('dir', 'rtl');
        document.documentElement.setAttribute('lang', 'ar');
        const bs = document.getElementById('bootstrapCSS');
        if (bs) bs.href = 'https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css';
      }
    })();
  </script>
  
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Custom Urban Style -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

  <!-- ======================================================================
       MINIMAL NAVBAR
       ====================================================================== -->
  <nav class="navbar navbar-custom py-2">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand" href="index.html">
        <img src="assets/images/logo.svg" alt="VeloMoto Logo" class="navbar-brand-logo logo-dark" height="34">
        <img src="assets/images/logo-light.svg" alt="VeloMoto Logo" class="navbar-brand-logo logo-light" height="34">
      </a>
      <div class="d-flex align-items-center gap-2">
        <button type="button" class="btn-theme-toggle" id="themeToggleBtn" aria-label="Toggle Dark/Light Mode" style="width: 36px; height: 36px; min-width: 36px; min-height: 36px; font-size: 0.95rem;">
          <i class="bi bi-sun-fill"></i>
        </button>
        <button type="button" class="btn-rtl-toggle" id="rtlToggleBtn" aria-label="Toggle RTL/LTR" style="height: 36px; min-height: 36px; font-size: 0.82rem; padding: 0 0.65rem;">
          <span class="rtl-toggle-text" id="rtlToggleText">RTL</span>
        </button>
        <div class="small text-muted ms-1 text-end">
          <span class="d-none d-sm-inline">Don't have an account? </span><a href="register.html" class="fw-bold text-warning ms-1 text-decoration-none">Sign Up</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- ======================================================================
       LOGIN AUTH CARD (Perfect Viewport Center & Compact)
       ====================================================================== -->
  <main class="auth-wrapper">
    <div class="auth-card login-card">
      <div class="auth-header mb-3 text-center">
        <div class="stat-icon yellow mx-auto mb-2" style="width: 44px; height: 44px; font-size: 1.15rem;">
          <i class="bi bi-box-arrow-in-right"></i>
        </div>
        <h2 class="text-white mb-0 fs-4 fw-bold">LOGIN</h2>
      </div>

      <!-- Dynamic Feedback Alerts -->
      <div id="loginSuccessAlert" class="alert alert-success py-1 px-2 small mb-2 d-none" role="alert"></div>
      <div id="loginErrorAlert" class="alert alert-danger py-1 px-2 small mb-2 d-none" role="alert"></div>

      <!-- Login Form -->
      <form id="loginForm" novalidate>
        <!-- Email -->
        <div class="mb-3">
          <label class="form-label login-label small fw-bold mb-1" for="loginIdentifier">Email Address</label>
          <div class="position-relative">
            <input type="email" id="loginIdentifier" class="custom-form-control ps-3 py-2" placeholder="alex@example.com" required>
          </div>
          <div class="form-feedback text-danger small">Please enter a valid email address.</div>
        </div>

        <!-- Password -->
        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label class="form-label login-label small fw-bold mb-0" for="loginPassword">Password</label>
          </div>
          <div class="position-relative">
            <input type="password" id="loginPassword" class="custom-form-control ps-3 pe-5 py-2" placeholder="Enter your password" required>
            <button type="button" class="btn border-0 position-absolute end-0 top-50 translate-middle-y text-muted me-2 p-0" id="togglePasswordBtn" aria-label="Toggle password visibility">
              <i class="bi bi-eye" id="togglePasswordIcon"></i>
            </button>
          </div>
          <div class="form-feedback text-danger small">Please enter your password.</div>
        </div>

        <!-- Remember Me & Forgot Password (Single Row) -->
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="form-check mb-0">
            <input class="form-check-input" type="checkbox" id="rememberMe">
            <label class="form-check-label text-muted small" for="rememberMe" style="font-size: 0.82rem;">
              Remember me
            </label>
          </div>
          <a href="#" class="small text-warning text-decoration-none fw-semibold" style="font-size: 0.82rem;" data-bs-toggle="modal" data-bs-target="#forgotPasswordModal">Forgot Password?</a>
        </div>

        <!-- Submit Button -->
        <div class="d-grid mb-3">
          <button type="submit" class="btn btn-yellow py-2 fw-bold">
            <i class="bi bi-box-arrow-in-right me-1"></i> Login
          </button>
        </div>
      </form>

      <div class="auth-divider">
        <span>OR CONTINUE WITH</span>
      </div>

      <div class="auth-social-group mb-3">
        <button type="button" class="auth-social-btn" onclick="showToast('Google Sign-In simulation: Click Demo Login above!', 'info')">
          <i class="bi bi-google text-danger"></i> Google
        </button>
        <button type="button" class="auth-social-btn" onclick="showToast('Apple Sign-In simulation: Click Demo Login above!', 'info')">
          <i class="bi bi-apple auth-apple-icon"></i> Apple
        </button>
      </div>

      <div class="text-center pt-2 small">
        <span class="text-muted" style="font-size: 0.82rem;">New to VeloMoto?</span>
        <a href="register.html" class="fw-bold text-warning ms-1 text-decoration-none" style="font-size: 0.82rem;">Create an Account</a>
      </div>
    </div>
  </main>

  <!-- ======================================================================
       FORGOT PASSWORD MODAL
       ====================================================================== -->
  <div class="modal fade" id="forgotPasswordModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content modal-content-custom">
        <div class="modal-header modal-header-custom">
          <h5 class="modal-title fw-bold text-white"><i class="bi bi-key-fill text-warning me-2"></i>Reset Password</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body modal-body-custom">
          <p class="text-muted small mb-3">
            Enter your registered email address or mobile phone number. We'll send you an instant OTP reset code.
          </p>
          <div class="mb-3">
            <label class="form-label text-light small fw-bold">Email or Phone</label>
            <input type="text" class="custom-form-control ps-3" placeholder="e.g., alex@example.com" id="forgotInput">
          </div>
        </div>
        <div class="modal-footer modal-footer-custom">
          <button type="button" class="btn btn-dark-outline btn-sm" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-yellow btn-sm" onclick="handleForgotPassword()">Send Reset OTP</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container-custom"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/script.js"></script>

  <script>
    // Password toggle visibility helper
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const passInput = document.getElementById('loginPassword');
    const toggleIcon = document.getElementById('togglePasswordIcon');
    if (toggleBtn && passInput && toggleIcon) {
      toggleBtn.addEventListener('click', () => {
        const type = passInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passInput.setAttribute('type', type);
        toggleIcon.className = type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
      });
    }

    function handleForgotPassword() {
      const input = document.getElementById('forgotInput');
      if (!input || !input.value.trim()) {
        showToast('Please enter your email or phone number.', 'error');
        return;
      }
      showToast('Password reset link sent to ' + input.value.trim(), 'success');
      const modal = bootstrap.Modal.getInstance(document.getElementById('forgotPasswordModal'));
      if (modal) modal.hide();
    }
  </script>
</body>
</html>
