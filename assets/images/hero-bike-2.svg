<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" width="100%" height="100%">
  <defs>
    <!-- Background Glow Gradients -->
    <radialGradient id="heroGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFC107" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#FF9800" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0B0B0D" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="goldGradient2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD043"/>
      <stop offset="50%" stop-color="#FFC107"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </linearGradient>

    <linearGradient id="cyanTrail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="bikeBodyGradient" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFC107"/>
      <stop offset="70%" stop-color="#FFA000"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <linearGradient id="darkMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D3748"/>
      <stop offset="100%" stop-color="#1A202C"/>
    </linearGradient>

    <filter id="softGlow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Ambient Lights & Speed Ring -->
  <circle cx="310" cy="240" r="190" fill="url(#heroGlow2)"/>
  
  <ellipse cx="310" cy="385" rx="270" ry="24" fill="#000000" opacity="0.6"/>
  <ellipse cx="310" cy="385" rx="220" ry="12" fill="#FFC107" opacity="0.12"/>

  <!-- City Skyline Silhouette Background -->
  <g opacity="0.18">
    <rect x="50" y="160" width="40" height="200" fill="#718096" rx="2"/>
    <rect x="100" y="130" width="55" height="230" fill="#A0AEC0" rx="3"/>
    <rect x="165" y="180" width="35" height="180" fill="#718096" rx="2"/>
    <rect x="210" y="110" width="65" height="250" fill="#A0AEC0" rx="3"/>
    <rect x="420" y="140" width="50" height="220" fill="#718096" rx="3"/>
    <rect x="480" y="100" width="60" height="260" fill="#A0AEC0" rx="3"/>
    <rect x="550" y="170" width="45" height="190" fill="#718096" rx="2"/>
  </g>

  <!-- Speed Motion Trails -->
  <g stroke-linecap="round">
    <line x1="40" y1="210" x2="160" y2="210" stroke="#FFC107" stroke-width="3" opacity="0.6"/>
    <line x1="20" y1="250" x2="130" y2="250" stroke="#00E5FF" stroke-width="2.5" opacity="0.5"/>
    <line x1="70" y1="290" x2="180" y2="290" stroke="#FFC107" stroke-width="3.5" opacity="0.7"/>
    <line x1="30" y1="330" x2="140" y2="330" stroke="#FFFFFF" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- Rear Wheel & Disc Brake -->
  <g id="rearWheel">
    <circle cx="160" cy="330" r="64" fill="#121216" stroke="#2D3748" stroke-width="12"/>
    <circle cx="160" cy="330" r="54" fill="none" stroke="#FFC107" stroke-width="4.5" stroke-dasharray="14 6"/>
    <circle cx="160" cy="330" r="32" fill="#1A202C" stroke="#718096" stroke-width="3"/>
    <circle cx="160" cy="330" r="14" fill="#FFC107"/>
    <!-- Spokes -->
    <line x1="160" y1="266" x2="160" y2="394" stroke="#4A5568" stroke-width="2"/>
    <line x1="96" y1="330" x2="224" y2="330" stroke="#4A5568" stroke-width="2"/>
    <line x1="115" y1="285" x2="205" y2="375" stroke="#4A5568" stroke-width="2"/>
    <line x1="115" y1="375" x2="205" y2="285" stroke="#4A5568" stroke-width="2"/>
  </g>

  <!-- Front Wheel & Disc Brake -->
  <g id="frontWheel">
    <circle cx="460" cy="330" r="64" fill="#121216" stroke="#2D3748" stroke-width="12"/>
    <circle cx="460" cy="330" r="54" fill="none" stroke="#FFC107" stroke-width="4.5" stroke-dasharray="14 6"/>
    <circle cx="460" cy="330" r="32" fill="#1A202C" stroke="#718096" stroke-width="3"/>
    <circle cx="460" cy="330" r="14" fill="#FFC107"/>
    <!-- Spokes -->
    <line x1="460" y1="266" x2="460" y2="394" stroke="#4A5568" stroke-width="2"/>
    <line x1="396" y1="330" x2="524" y2="330" stroke="#4A5568" stroke-width="2"/>
    <line x1="415" y1="285" x2="505" y2="375" stroke="#4A5568" stroke-width="2"/>
    <line x1="415" y1="375" x2="505" y2="285" stroke="#4A5568" stroke-width="2"/>
  </g>

  <!-- Exhaust Pipe & Modern Battery/Motor Block -->
  <path d="M220 340 L160 340 L120 330" fill="none" stroke="#718096" stroke-width="10" stroke-linecap="round"/>
  <rect x="110" y="322" width="46" height="16" rx="5" fill="#4A5568" stroke="#FFC107" stroke-width="1.5"/>

  <!-- Bike Frame, Engine & Swingarm -->
  <path d="M160 330 L250 330 L290 270 L210 270 Z" fill="url(#darkMetal)" stroke="#111" stroke-width="2"/>
  <circle cx="260" cy="320" r="22" fill="#1A202C" stroke="#FFC107" stroke-width="2"/>
  <path d="M255 310 L265 320 L255 330" fill="none" stroke="#FFC107" stroke-width="3" stroke-linecap="round"/>

  <!-- Modern Sharp Sports Fuel Tank & Fairing -->
  <path d="M230 260 L320 220 L390 230 L420 270 L340 280 L250 280 Z" fill="url(#bikeBodyGradient)" stroke="#B45309" stroke-width="2"/>
  <!-- Aerodynamic Accent Stripes -->
  <path d="M260 255 L340 235 L380 245 L320 265 Z" fill="#1A202C" opacity="0.85"/>
  <path d="M280 252 L350 238" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Front Fork & Handlebar -->
  <path d="M460 330 L410 210 L395 210" fill="none" stroke="#E2E8F0" stroke-width="8" stroke-linecap="round"/>
  <path d="M410 210 L430 195" fill="none" stroke="#FFC107" stroke-width="6" stroke-linecap="round"/>
  <circle cx="430" cy="195" r="7" fill="#1A202C"/>

  <!-- LED Projector Headlight & Light Cone -->
  <path d="M430 230 L590 200 L590 290 Z" fill="url(#cyanTrail)" opacity="0.35"/>
  <polygon points="420,230 435,225 435,245 420,240" fill="#00E5FF" filter="url(#softGlow2)"/>

  <!-- Dual Ergonomic Seats (Captain & Passenger) -->
  <path d="M210 260 C240 258 270 260 295 260 C280 245 250 245 220 250 Z" fill="#0F172A" stroke="#334155" stroke-width="2"/>
  <path d="M295 260 C330 258 350 260 370 265 C360 250 330 248 305 255 Z" fill="#0F172A" stroke="#334155" stroke-width="2"/>

  <!-- Passenger (Rider) Figure -->
  <!-- Passenger Body & Arms holding Captain -->
  <path d="M245 250 L275 190 L260 160" fill="none" stroke="#2D3748" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M275 190 L330 205" fill="none" stroke="#2D3748" stroke-width="10" stroke-linecap="round"/>
  <!-- Passenger Helmet (Yellow & Sleek) -->
  <circle cx="265" cy="135" r="23" fill="#FFC107" stroke="#D97706" stroke-width="2.5"/>
  <path d="M270 128 Q288 135 272 146 Z" fill="#1A202C"/>

  <!-- Captain (Driver) Figure -->
  <!-- Captain Body, Jacket & Arms holding handlebar -->
  <path d="M325 250 L350 180 L395 198" fill="none" stroke="#1A202C" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M350 180 L425 195" fill="none" stroke="#FFC107" stroke-width="12" stroke-linecap="round"/>
  <!-- Captain VeloMoto Safety Jacket Vest -->
  <path d="M335 185 L365 178 L370 215 L340 220 Z" fill="#FFC107"/>
  <!-- Captain Helmet with Smart Visor -->
  <circle cx="360" cy="120" r="26" fill="#1A202C" stroke="#FFC107" stroke-width="3"/>
  <path d="M365 110 Q390 120 370 135 Z" fill="#00E5FF" filter="url(#softGlow2)"/>

  <!-- Floating Live Info Badges -->
  <!-- Badge 1: 3 Min ETA -->
  <g transform="translate(140, 60)" filter="url(#softGlow2)">
    <rect width="145" height="42" rx="21" fill="#18181D" stroke="#FFC107" stroke-width="1.8"/>
    <circle cx="24" cy="21" r="13" fill="#FFC107"/>
    <path d="M24 14 L24 21 L28 23" fill="none" stroke="#18181D" stroke-width="2.5" stroke-linecap="round"/>
    <text x="46" y="19" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Instant Pickup</text>
    <text x="46" y="32" fill="#FFC107" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800">ETA 2 - 4 Mins</text>
  </g>

  <!-- Badge 2: 4.9 Star Rating -->
  <g transform="translate(420, 80)">
    <rect width="135" height="38" rx="19" fill="#18181D" stroke="#FFC107" stroke-width="1.8"/>
    <text x="20" y="24" fill="#FFC107" font-family="'Plus Jakarta Sans', sans-serif" font-size="14">★</text>
    <text x="38" y="23" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800">4.9/5 Rating</text>
    <text x="100" y="23" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">(4M+)</text>
  </g>

  <!-- Badge 3: ₹19 Base Fare Guaranteed -->
  <g transform="translate(360, 390)">
    <rect width="195" height="42" rx="21" fill="#FFC107" stroke="#FFA000" stroke-width="2"/>
    <text x="22" y="26" fill="#000000" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="900">⚡ Starting at ₹19 Flat</text>
  </g>
</svg>
