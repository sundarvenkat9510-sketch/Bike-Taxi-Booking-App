<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <defs>
    <linearGradient id="s1grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </linearGradient>
  </defs>
  <!-- Background Card Elements -->
  <rect x="20" y="20" width="280" height="200" rx="20" fill="#161922" stroke="#2B313E" stroke-width="1.5"/>
  <!-- Map Grid lines -->
  <line x1="40" y1="70" x2="280" y2="70" stroke="#222836" stroke-width="2"/>
  <line x1="40" y1="120" x2="280" y2="120" stroke="#222836" stroke-width="2"/>
  <line x1="40" y1="170" x2="280" y2="170" stroke="#222836" stroke-width="2"/>
  <line x1="100" y1="40" x2="100" y2="200" stroke="#222836" stroke-width="2"/>
  <line x1="180" y1="40" x2="180" y2="200" stroke="#222836" stroke-width="2"/>
  <line x1="240" y1="40" x2="240" y2="200" stroke="#222836" stroke-width="2"/>

  <!-- Route Path line (Dashed with glow) -->
  <path d="M75 140 C110 140, 120 80, 180 80 C210 80, 220 150, 245 150" 
        stroke="url(#s1grad)" stroke-width="4" stroke-dasharray="6,4" fill="none"/>

  <!-- Pickup Marker -->
  <g transform="translate(75, 140)">
    <circle cx="0" cy="0" r="14" fill="#10B981" opacity="0.25"/>
    <circle cx="0" cy="0" r="9" fill="#10B981"/>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
    <!-- Label -->
    <rect x="-35" y="-36" width="70" height="22" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
    <text x="0" y="-22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="9" fill="#FFFFFF" text-anchor="middle">PICKUP</text>
  </g>

  <!-- Destination Marker -->
  <g transform="translate(245, 150)">
    <circle cx="0" cy="0" r="14" fill="#EF4444" opacity="0.25"/>
    <circle cx="0" cy="0" r="9" fill="#EF4444"/>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
    <!-- Label -->
    <rect x="-35" y="-36" width="70" height="22" rx="6" fill="#0F172A" stroke="#EF4444" stroke-width="1"/>
    <text x="0" y="-22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="9" fill="#FFFFFF" text-anchor="middle">DROP OFF</text>
  </g>

  <!-- Step number badge -->
  <circle cx="270" cy="45" r="16" fill="#FFC107"/>
  <text x="270" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="14" fill="#121212" text-anchor="middle">1</text>
</svg>
